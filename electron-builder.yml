appId: com.localpilot.app
productName: LocalPilot
copyright: Copyright © LocalPilot contributors
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.*.json}'
  - '!{.eslintignore,.eslintrc.*,.prettierignore,.prettierrc*,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{*.log,*.lock}'
  - '!vitest.config.*'
  - '!**/*.{spec,test}.{ts,tsx}'
  - '!design-system/**'
  - '!.cursor/**'
  - '!.github/**'
extraResources:
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - resources/**
win:
  icon: build/icon.png
  target:
    - nsis
mac:
  icon: build/icon.png
  target:
    - dmg
  artifactName: ${name}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png
publish:
  provider: github
